<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yExplosion — поиск демографических взрывов среди Y-SNP</title>

    <link rel="stylesheet" type="text/css" href="css/leaflet.css">
    <link rel="stylesheet" type="text/css" href="css/jquery-ui.css">

    <script src="libs/leaflet.js"></script>
    <script src="libs/jquery-1.12.4.js"></script>
    <script src="libs/jquery-ui.js"></script>
    <script src="libs/h3-js.js"></script>

    <script src="js/variables.js"></script>
    <script src="js/actions.js"></script>

    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f4f7f9; display: flex; justify-content: center; padding: 20px; }
        #app-container { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h2 { color: #007bff; margin-top: 0; display: flex; align-items: center; gap: 10px; }

        .section { border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; margin-bottom: 12px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .row > div { flex: 1; }

        label { display: block; font-size: 13px; margin-bottom: 4px; color: #444; font-weight: 600; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; color: #333; }

        #miniMap, #resultMap { height: 280px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; background: #f0f0f0; }

        .fullscreen-map {
            position: fixed !important;
            top: 0; left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
            margin: 0 !important;
            border-radius: 0 !important;
        }
        #toggleFullscreen {
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .controls-grid { display: flex; gap: 15px; align-items: flex-end; }
        .control-col { flex: 1; display: flex; flex-direction: column; }

        .btn-action {
            height: 48px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            color: white; transition: opacity 0.2s;
        }
        .btn-list { background-color: #448aff; }
        .btn-map { background-color: #58a65c; }
        .btn-action:hover { opacity: 0.9; }
        .btn-action:disabled { background-color: #ccc; cursor: not-allowed; }

        #resultsList { padding: 0; list-style: none; max-height: 400px; overflow-y: auto; margin: 0; }
        #resultsList li { padding: 12px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-size: 14px; }

        .section-grid { background: #f8f9fa; border-color: #d1d4d7; }
        .section-son { border-left: 4px solid #28a745; background: #f8fff9; }
        .section-results { border-top: 2px solid #007bff; background: #fff; min-height: 100px; position: relative; }

        .optional-badge { font-size: 10px; background: #e8f0fe; color: #1a73e8; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>
<body>

<div id="app-container">
    <h2>💥 yExplosion</h2>

    <div class="section section-grid">
        <div class="section-title">0. Ячеистость карты</div>
        <select id="gridSize" onchange="clearSelection(); clearResults();">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>

    <div class="section">
        <div class="section-title">1. Фильтры</div>
        <div class="row">
            <div><label>Мин. сыновей</label><input type="number" id="mSons" value="3"></div>
            <div><label>Мин. ячеек</label><input type="number" id="mHex" value="9"></div>
        </div>
        <div class="row">
            <div><label>TMRCA С</label><input type="number" id="tStart" value="-250"></div>
            <div><label>TMRCA По</label><input type="number" id="tEnd" value="250"></div>
        </div>
    </div>

    <div class="section section-son">
        <div class="section-title">2. Критерии учета сыновей</div>
        <div class="row">
            <div><label>Макс. время до ветвления</label><input type="number" id="tWindow" value="100"></div>
            <div><label>Мин. ячеек</label><input type="number" id="mHexSon" value="3"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">3. География <span class="optional-badge">Опционально</span></div>
        <label>Искать только по SNP выбранных ячеек</label>
        <div id="miniMap"></div>
        <button type="button" onclick="clearSelection()"
                style="padding: 8px; cursor: pointer; width: 100%; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 13px;">
            Очистить
        </button>
    </div>

    <div class="section">
        <div class="section-title">4. Топология <span class="optional-badge">Опционально</span></div>
        <label>Искать только по потомкам выбранного SNP</label>
        <input type="text" id="pSnp" placeholder="Напр: R-CTS1211">
    </div>

    <div class="section">
        <div class="section-title">5. Формат вывода</div>
        <div class="controls-grid">
            <div class="control-col">
                <button id="runBtn" class="btn-action btn-list" onclick="runBrancher('list')">📋 Список</button>
            </div>
            <div class="control-col">
                <label>Мин. пересекающихся SNP</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="minOverlap" value="2" style="flex: 0.4; text-align: center; height: 48px;">
                    <button id="mapBtn" class="btn-action btn-map" style="flex: 1;" onclick="runBrancher('map')">🌍
                        Карта
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="section section-results">
        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
            6. Результаты
            <button id="toggleFullscreen" onclick="toggleMapFullscreen()" style="display: none;">На весь экран ⛶
            </button>
        </div>
        <div id="resultMap" style="display: none;"></div>
        <ul id="resultsList">
            <li style="color: #888; justify-content: center;">Настройте фильтры и запустите поиск</li>
        </ul>
    </div>
</div>

</body>
</html>
